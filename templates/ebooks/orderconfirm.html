    <title>Thank You</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .abc {
            width: 80%;
            margin: 0 auto;
            padding-left: 40px; 
            padding-right: 40px;

        .mainhead {

    <nav class="bg-[#faf8f6] py-4 flex justify-between items-center mb-0">

        <ul class="hidden md:flex space-x-6 text-gray-700">

            <li class="hover:text-black">Blog</li>
            <li class="hover:text-black">About Us</li>

        <div class="flex items-center space-x-4">

            <span class="text-gray-700">|</span>
            <button class="text-gray-700 hover:text-black"><a href="./loginpage.html">Sign In</a></button>
